    language: "fr"
    country: "France"
    category: "international"
    url: "https://www.lemonde.fr/international/rss_full.xml"

  - name: "Franceinfo"
    source_id: "franceinfo"
    type: "rss"
    role: "acquisition"
    language: "fr"
    country: "France"
    category: "general"
    url: "https://www.francetvinfo.fr/titres.rss"

  - name: "BBC News"
    source_id: "bbc_news"
    type: "rss"
    role: "acquisition"
    language: "en"
