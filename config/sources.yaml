# Contrat des sources CheckIt.AI.
#
# Les valeurs communes sont centralisées dans defaults. Le futur chargeur
# src/config/source_config.py doit fusionner ces valeurs avec chaque source,
# puis valider le contrat avant le lancement des extracteurs.

defaults:
  common:
    enabled: true
    language: null
    country: "International"
    category: "general"
    max_articles: 100

  api:
    role: "acquisition"
    pagination:
      enabled: false
      parameter: "page"
      start: 1
      max_pages: 1
      page_size_parameter: null
      page_size: null

  rss:
    role: "acquisition"

  social:
    role: "acquisition"

  dataset:
    role: "labeled_reference"
    chunksize: 10000

  scraper:
    role: "labeled_reference"
    respect_robots_txt: true
    request_delay_seconds: 1.0

  filters:
    acquisition:
      require_title: true
      require_text: false
      require_image: false
      require_url: true
      require_label: false
      min_title_length: 10
      min_text_length: 0
      min_total_text_length: 30
      remove_deleted_content: true
      remove_duplicates: true
      validate_urls: true
      allowed_labels: []

    labeled_reference:
      require_title: true
      require_text: true
      require_image: false
      require_url: false
      require_label: true
      min_title_length: 10
      min_text_length: 20
      min_total_text_length: 30
      remove_deleted_content: true
      remove_duplicates: true
      validate_urls: false
      allowed_labels:
        - "fake"
        - "real"
        - "true"
        - "false"

    multimodal_reference:
      require_title: true
      require_text: false
      require_image: false
      require_url: false
      require_label: true
      min_title_length: 10
      min_text_length: 0
      min_total_text_length: 30
      remove_deleted_content: true
      remove_duplicates: true
      validate_urls: false
      allowed_labels:
        - "fake"
        - "real"
        - "true"
        - "false"
        
    fact_check_reference:
      require_label: true
      allowed_labels:
        - "true"
        - "false"
        - "misleading"
        - "partly_false"
        - "unproven"

