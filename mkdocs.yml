      - Cas typiques de fake news multimodales: 01_exploration_sources/03_fake.md
      - Critères d'évaluation: 01_exploration_sources/04_criteres.md
      - Panorama des sources: 01_exploration_sources/05_panorama.md
      - Jeux de données académiques: 01_exploration_sources/06_datasets.md
      - API d'actualité: 01_exploration_sources/07_apis.md
      - Flux RSS: 01_exploration_sources/08_flux_rss.md
      - Réseaux sociaux: 01_exploration_sources/09_reseaux.md
      - Comparaison des sources: 01_exploration_sources/10_comparaison.md
      - Recommandations: 01_exploration_sources/11_recommandations.md
      - Droits d'utilisation: 01_exploration_sources/12_droits.md
